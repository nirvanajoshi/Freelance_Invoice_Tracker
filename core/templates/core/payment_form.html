{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card card-soft p-4">
            <h2 class="h4 fw-semibold text-navy mb-1">Log payment for Invoice #{{ invoice.pk }}</h2>
            <p class="text-muted mb-4">Record the payment details below.</p>

            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Record Payment</button>
                    <a href="{% url 'invoice_detail' invoice.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
