{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card card-soft p-4">
            <h2 class="h4 fw-semibold text-navy mb-3">Delete Client</h2>
            <p class="mb-4">Are you sure you want to delete <strong>{{ client.name }}</strong>? This will remove the related projects and invoices as well.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{% url 'client_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
